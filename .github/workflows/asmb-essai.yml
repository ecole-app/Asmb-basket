name: ASMB en essai de 30 jours (une fois)

# À lancer à la main (une fois) : met la fiche du club d'origine (clubs/asmb) en plan "trial",
# 30 jours à partir de maintenant, comme n'importe quel nouveau club. Ne touche à rien d'autre.
# Ne fait rien si le club est déjà en essai non terminé.
on:
  workflow_dispatch:

jobs:
  essai:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Passer l'ASMB en essai
        env:
          CLE: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          mkdir w && cd w && npm init -y >/dev/null && npm i firebase-admin@14 --no-audit --no-fund >/dev/null
          echo "$CLE" > "$RUNNER_TEMP/cle.json"
          cat > run.js <<'JS'
          const { initializeApp, cert } = require("firebase-admin/app");
          const { getFirestore, Timestamp } = require("firebase-admin/firestore");
          initializeApp({ credential: cert(require(process.env.RUNNER_TEMP + "/cle.json")) });
          (async () => {
            const ref = getFirestore().collection("clubs").doc("asmb");
            const snap = await ref.get();
            if (!snap.exists) throw new Error("clubs/asmb introuvable");
            const d = snap.data();
            const fin = d.trialEndsAt && d.trialEndsAt.toDate ? d.trialEndsAt.toDate() : null;
            console.log("AVANT :", JSON.stringify({ plan: d.plan || null, status: d.status || null, trialEndsAt: fin }));
            if (d.plan === "trial" && fin && fin.getTime() > Date.now()) { console.log("Déjà en essai : rien à faire."); return; }
            const finNouvelle = new Date(Date.now() + 30 * 86400000);
            await ref.update({ plan: "trial", status: "active", trialEndsAt: Timestamp.fromDate(finNouvelle) });
            const apres = (await ref.get()).data();
            console.log("APRÈS :", JSON.stringify({ plan: apres.plan, status: apres.status, trialEndsAt: apres.trialEndsAt.toDate() }));
          })().catch((e) => { console.error("ERREUR", e.message); process.exit(1); });
          JS
          node run.js
          rm -f "$RUNNER_TEMP/cle.json"
