name: Déploiement Firebase

# Met à jour les Cloud Functions et les règles Firestore quand elles changent.
# Demande le secret GitHub FIREBASE_SERVICE_ACCOUNT (clé JSON d'un compte de service
# du projet asmb-app, rôles « Firebase Admin » ou équivalent). Sans lui, ce workflow
# s'arrête sans rien casser.
on:
  push:
    branches: [main]
    paths:
      - "functions/**"
      - "firestore.rules"
      - "firebase.json"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Vérifier le secret
        id: cle
        env:
          CLE: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$CLE" ]; then echo "ok=false" >> "$GITHUB_OUTPUT"; echo "Secret FIREBASE_SERVICE_ACCOUNT absent : rien déployé."; else echo "ok=true" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/setup-node@v4
        if: steps.cle.outputs.ok == 'true'
        with:
          node-version: 22
      - name: Déployer functions + règles
        if: steps.cle.outputs.ok == 'true'
        env:
          CLE: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          echo "$CLE" > "$RUNNER_TEMP/cle.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/cle.json"
          (cd functions && npm install --no-audit --no-fund)
          # La sortie est aussi remontée en annotation (visible en haut de la page du run).
          if ! npx --yes firebase-tools@14 deploy --only functions,firestore:rules --project asmb-app --non-interactive --force > "$RUNNER_TEMP/sortie.txt" 2>&1; then
            cat "$RUNNER_TEMP/sortie.txt"
            echo "::error title=Echec du deploiement::$(tail -n 25 "$RUNNER_TEMP/sortie.txt" | sed 's/%/%25/g' | tr '\n' '|')"
            rm -f "$RUNNER_TEMP/cle.json"
            exit 1
          fi
          cat "$RUNNER_TEMP/sortie.txt"
          rm -f "$RUNNER_TEMP/cle.json"
