name: Activer la double authentification (TOTP)

# À lancer à la main (une fois) : active la double authentification par application
# d'authentification (TOTP) sur le projet asmb-app, via l'API Identity Platform.
# N'active PAS l'option SMS (payante à l'envoi).
on:
  workflow_dispatch:

jobs:
  mfa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Activer TOTP
        env:
          CLE: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          mkdir w && cd w && npm init -y >/dev/null && npm i google-auth-library@9 --no-audit --no-fund >/dev/null
          echo "$CLE" > "$RUNNER_TEMP/cle.json"
          cat > run.js <<'JS'
          const { GoogleAuth } = require("google-auth-library");
          (async () => {
            const auth = new GoogleAuth({ keyFile: process.env.RUNNER_TEMP + "/cle.json", scopes: ["https://www.googleapis.com/auth/cloud-platform"] });
            const c = await auth.getClient();
            const url = "https://identitytoolkit.googleapis.com/admin/v2/projects/asmb-app/config";
            const body = { mfa: { state: "ENABLED", providerConfigs: [{ state: "ENABLED", totpProviderConfig: { adjacentIntervals: 1 } }] } };
            const r = await c.request({ url: url + "?updateMask=mfa", method: "PATCH", data: body });
            console.log(JSON.stringify(r.data.mfa));
          })().catch((e) => { console.error("ERREUR", e.response ? JSON.stringify(e.response.data) : e.message); process.exit(1); });
          JS
          node run.js
          rm -f "$RUNNER_TEMP/cle.json"
