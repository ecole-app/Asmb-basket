name: Purge formations (ponctuel)
on:
  workflow_dispatch:
jobs:
  purge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Effacer la collection formations (et ses sous-collections)
        env:
          CLE: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          echo "$CLE" > "$RUNNER_TEMP/cle.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/cle.json"
          npx --yes firebase-tools@13 firestore:delete formations --recursive --force --project asmb-app --non-interactive 2>&1 | tail -20
          rm -f "$RUNNER_TEMP/cle.json"
