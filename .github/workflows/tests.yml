name: Tests automatiques

on:
  push:
    branches: [main]
    paths: ["firestore.rules", "js/**", "tests/**", "sw.js", "index.html", "i18n/**", ".github/workflows/tests.yml"]
  pull_request:
  workflow_dispatch:

jobs:
  regles:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: tests
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tests/package-lock.json
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - name: Règles métier (packs, licences, accès limité)
        run: npm run test:metier:ci
        env:
          TITRE_TESTS: Tests métier
      - name: Règles de sécurité Firestore
        run: set -o pipefail; npm run test:rules:ci 2>&1 | tee sortie.log
        shell: bash
        env:
          TITRE_TESTS: Tests des règles
      - name: Résumé en cas d'échec
        if: failure()
        shell: bash
        run: |
          [ -f sortie.log ] || exit 0
          msg=$(grep -v '^::' sortie.log | tail -n 60 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
          echo "::error title=Fin du journal::$msg"
