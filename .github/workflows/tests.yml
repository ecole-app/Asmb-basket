name: Tests des règles Firestore

on:
  push:
    branches: [main]
    paths: ["firestore.rules", "tests/**", ".github/workflows/tests.yml"]
  pull_request:
  workflow_dispatch:

jobs:
  regles:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: tests
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tests/package-lock.json
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: set -o pipefail; npm run test:rules:ci 2>&1 | tee sortie.log
        shell: bash
      - name: Résumé en cas d'échec
        if: failure()
        shell: bash
        run: |
          msg=$(grep -v '^::' sortie.log | tail -n 60 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
          echo "::error title=Fin du journal::$msg"
